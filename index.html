<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MR-Volailles</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f3f8f6;
      color: #183b35;
    }

    header {
      background: linear-gradient(135deg, #0b6b5c, #168aad);
      color: white;
      padding: 25px 15px;
      text-align: center;
    }

    header h1 {
      font-size: 32px;
    }

    nav {
      background: white;
      padding: 12px;
      text-align: center;
      box-shadow: 0 2px 8px #0002;
    }

    nav a {
      color: #0b6b5c;
      text-decoration: none;
      margin: 8px 12px;
      font-weight: bold;
      display: inline-block;
    }

    .accueil {
      padding: 35px 20px;
      text-align: center;
    }

    .accueil h2 {
      color: #0b6b5c;
      margin-bottom: 10px;
      font-size: 28px;
    }

    .formulaire {
      background: white;
      max-width: 600px;
      margin: 20px auto;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 12px #0002;
    }

    .formulaire h2 {
      color: #0b6b5c;
      margin-bottom: 20px;
      text-align: center;
    }

    input, textarea {
      width: 100%;
      padding: 12px;
      margin-bottom: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    input[type="file"] {
      background: #f3f8f6;
    }

    button {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 8px;
      background: #0b6b5c;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #168aad;
    }

    button:disabled {
      background: #999;
      cursor: not-allowed;
    }

    #message {
      text-align: center;
      margin-top: 12px;
      font-weight: bold;
    }

    .produits {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      padding: 20px;
      max-width: 1100px;
      margin: auto;
    }

    .carte {
      background: white;
      border-radius: 15px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 4px 12px #0002;
    }

    .carte h3 {
      color: #0b6b5c;
      margin-bottom: 10px;
      font-size: 22px;
    }

    .carte p {
      margin-bottom: 15px;
      color: #555;
    }

    .prix {
      font-size: 20px;
      font-weight: bold;
      color: #168aad;
    }

    .ville {
      margin-top: 10px;
      color: #666;
    }

    .photo {
      width: 100%;
      height: 220px;
      object-fit: cover;
      border-radius: 10px;
      margin-bottom: 15px;
    }

    .contact {
      background: #0b6b5c;
      color: white;
      text-align: center;
      padding: 30px 20px;
      margin-top: 30px;
    }

    .contact h2 {
      margin-bottom: 12px;
    }

    footer {
      background: #073b35;
      color: white;
      text-align: center;
      padding: 15px;
      font-size: 14px;
    }
  </style>
</head>

<body>

<header>
  <h1>MR-Volailles</h1>
</header>

<nav>
  <a href="#accueil">Accueil</a>
  <a href="#produits">Volailles</a>
  <a href="#ajouter">Ajouter une annonce</a>
  <a href="#contact">Contact</a>
</nav>

<section class="accueil" id="accueil">
  <h2>Bienvenue chez MR-Volailles</h2>
  <p>Découvrez nos volailles disponibles à la vente.</p>
</section>

<section class="formulaire" id="ajouter">
  <h2>Ajouter une annonce</h2>

  <form id="annonceForm">

    <input
      type="text"
      id="nom"
      placeholder="Nom de la volaille"
      required
    >

    <textarea
      id="description"
      placeholder="Description"
      required
    ></textarea>

    <input
      type="number"
      id="prix"
      placeholder="Prix en €"
      step="0.01"
      min="0"
      required
    >

    <input
      type="text"
      id="ville"
      placeholder="Ville"
      required
    >
<input
  type="email"
  id="email"
  placeholder="Ton adresse e-mail"
  required
>
    <input
      type="file"
      id="photo"
      accept="image/*"
    >

    <button type="submit" id="publier">
      📷 Publier l'annonce
    </button>

  </form>

  <div id="message"></div>
</section>

<section class="produits" id="produits"></section>

<section class="contact" id="contact">
  <h2>Contact</h2>
  <p>Pour connaître les disponibilités et les prix, contactez-nous.</p>
</section>

<footer>
  © 2026 MR-Volailles
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
  "https://aqkylstkrscajjqimszc.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_fuTZblrYhvvZkzJjqq0srg_FlxSmNb7";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

const formulaire =
  document.getElementById("annonceForm");

const message =
  document.getElementById("message");

const produits =
  document.getElementById("produits");

const bouton =
  document.getElementById("publier");


async function afficherAnnonces() {

  produits.innerHTML =
    "<p>Chargement des annonces...</p>";

  const { data, error } =
    await supabaseClient
      .from("annonces")
      .select("*")
      .order("created_at", {
        ascending: false
      });

  if (error) {

    console.error(error);

    produits.innerHTML =
      "<p>Impossible de charger les annonces.</p>";

    return;
  }

  if (!data || data.length === 0) {

    produits.innerHTML =
      "<p>Aucune annonce pour le moment.</p>";

    return;
  }

  produits.innerHTML = "";

  data.forEach((annonce) => {

    const carte =
      document.createElement("div");

    carte.className = "carte";

    carte.innerHTML = `

      ${
        annonce.photo
        ? `<img
            class="photo"
            src="${annonce.photo}"
            alt="${annonce.nom}"
          >`
        : ""
      }

      <h3>${annonce.nom}</h3>

      <p>
        ${annonce.description || ""}
      </p>

      <div class="prix">
        ${annonce.prix} €
      </div>

      <div class="ville">
        📍 ${annonce.ville}
      </div>

    `;

    produits.appendChild(carte);

  });
}


formulaire.addEventListener(
  "submit",
  async (event) => {

    event.preventDefault();

    bouton.disabled = true;

    message.textContent =
      "Publication en cours...";

    try {

      const nom =
        document.getElementById("nom").value;

      const description =
        document.getElementById("description").value;

      const prix =
        Number(
          document.getElementById("prix").value
        );

      const ville =
        document.getElementById("ville").value;
const email =
  document.getElementById("email").value;
      
      const fichier =
        document.getElementById("photo").files[0];

      let urlPhoto = null;


      /* ENVOI DE LA PHOTO */

      if (fichier) {

        if (!fichier.type.startsWith("image/")) {

          throw new Error(
            "Le fichier doit être une image."
          );

        }

        if (fichier.size > 5 * 1024 * 1024) {

          throw new Error(
            "La photo doit faire moins de 5 Mo."
          );

        }

        const extension =
          fichier.name
            .split(".")
            .pop()
            .toLowerCase();

        const nomFichier =
          Date.now() +
          "-" +
          Math.random()
            .toString(36)
            .substring(2) +
          "." +
          extension;


        const { error: uploadError } =
          await supabaseClient.storage
            .from("photos-annonces")
            .upload(
              nomFichier,
              fichier,
              {
                cacheControl: "3600",
                upsert: false
              }
            );


        if (uploadError) {

          console.error(uploadError);

          throw new Error(
            "Impossible d'envoyer la photo."
          );

        }


        const { data: photoData } =
          supabaseClient.storage
            .from("photos-annonces")
            .getPublicUrl(nomFichier);

        urlPhoto =
          photoData.publicUrl;

      }


      /* ENREGISTREMENT DE L'ANNONCE */

      const { error } =
        await supabaseClient
          .from("annonces")
          .insert([
           {
  nom: nom,
  description: description,
  prix: prix,
  ville: ville,
  photo: urlPhoto,
  vendeur_email: email
             }
          ]);


      if (error) {

        console.error(error);

        throw new Error(
          "Impossible d'enregistrer l'annonce."
        );

      }


      message.textContent =
        "✅ Annonce publiée avec succès !";

      formulaire.reset();

      await afficherAnnonces();

    }

    catch (error) {

      console.error(error);

      message.textContent =
        "❌ " + error.message;

    }

    finally {

      bouton.disabled = false;

    }

  }
);


afficherAnnonces();

</script>

</body>
</html>
